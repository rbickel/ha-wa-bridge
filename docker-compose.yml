#      interval: 60s
#      timeout: 10s
#      retries: 3
#      start_period: 30s

  # ── Option B: Baileys bridge (no Puppeteer / no Chromium) ───────────────────
  # Prototype – same WebSocket API as Option A so HA integration works with
  # either service.  No browser process means substantially lower RAM usage.
  # Limitation: send_event (WhatsApp Scheduled Events) is not yet supported.
  #
  # To use: comment out the wa-bridge service above, then uncomment below.
  wa-bridge-baileys:
    build: ./wa-bridge-baileys
    container_name: ha-whatsapp-bridge
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./wa-bridge-baileys/.baileys_data:/usr/src/app/.baileys_data
    environment:
      - DETECT_OWN_MESSAGES=false
      - INCOMING_MESSAGES_MODE=all
      - INCOMING_MESSAGE_LOG_LEVEL=FULL
      # - ALLOWED_NUMBERS=40741234567
      # - ALLOWED_GROUPS=Family Group,Work Team
    # Memory limits to prevent OOM crashes
    mem_limit: 1g
    mem_reservation: 256m
    # Health check to detect if bridge is unresponsive
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => r.statusCode === 404 ? process.exit(0) : process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

